<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f18" />
      <stop offset="50%" stop-color="#071712" />
      <stop offset="100%" stop-color="#030b09" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="1000" fill="url(#bgGrad3)" />
  <circle cx="800" cy="500" r="450" fill="#008060" opacity="0.1" filter="blur(80px)" />

  <!-- Top Category Tag -->
  <g transform="translate(800, 75)">
    <rect x="-190" y="0" width="380" height="38" rx="19" fill="#008060" fill-opacity="0.25" stroke="#25D366" stroke-width="1.5" />
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#25D366" text-anchor="middle" letter-spacing="1">SEAMLESS WAREHOUSE DISPATCH</text>
  </g>

  <!-- Main Headline -->
  <text x="800" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Instant Real-Time Order Tags: COD-Confirmed &amp; COD-Cancelled
  </text>
  
  <!-- Sub-headline -->
  <text x="800" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Warehouse and fulfillment teams know exactly which parcels are safe to pack and dispatch.
  </text>

  <!-- Central Shopify Admin Mockup -->
  <g transform="translate(120, 245)" filter="url(#boxShadow)">
    <rect width="1360" height="690" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Shopify Admin Top Navigation Mockup -->
    <rect width="1360" height="70" rx="22" fill="#1a1a1a" />
    <path d="M 0,22 Q 0,70 0,70 L 1360,70 Q 1360,22 1360,70 L 1360,22 Q 1360,0 1338,0 L 22,0 Q 0,0 0,22" fill="#1a1a1a" />

    <!-- Shopify Bag Icon & Breadcrumb -->
    <circle cx="45" cy="35" r="14" fill="#95bf47" />
    <text x="45" y="40" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
    <text x="75" y="41" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Shopify Admin</text>
    <text x="200" y="41" font-family="-apple-system, sans-serif" font-size="15" fill="#64748b">/</text>
    <text x="220" y="41" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Orders</text>

    <!-- Search bar in top bar -->
    <rect x="500" y="18" width="450" height="34" rx="8" fill="#2d2d2d" />
    <text x="520" y="40" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">🔍 Filter orders by tag: COD-Confirmed...</text>

    <!-- Orders Filter Tabs -->
    <g transform="translate(40, 100)">
      <text x="10" y="25" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Orders</text>
      
      <!-- Filter Chips -->
      <rect x="140" y="6" width="70" height="30" rx="6" fill="#0f172a" />
      <text x="175" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">All</text>

      <rect x="220" y="6" width="160" height="30" rx="6" fill="#eefbf4" stroke="#008060" stroke-width="1.5" />
      <text x="300" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#008060" text-anchor="middle">✔ COD-Confirmed (1,284)</text>

      <rect x="390" y="6" width="160" height="30" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
      <text x="470" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#be123c" text-anchor="middle">✖ COD-Cancelled (86)</text>
    </g>

    <!-- Orders Table Header -->
    <g transform="translate(40, 160)">
      <rect width="1280" height="42" rx="8" fill="#f1f5f9" />
      <text x="24" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569">ORDER</text>
      <text x="130" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569">DATE</text>
      <text x="240" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569">CUSTOMER</text>
      <text x="440" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569">TOTAL</text>
      <text x="560" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569">PAYMENT</text>
      <text x="700" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569">AUTOMATED TAGS</text>
      <text x="960" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569">FULFILLMENT STATUS</text>
    </g>

    <!-- Row 1: COD-Confirmed (Hero Row) -->
    <g transform="translate(40, 215)">
      <rect width="1280" height="85" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
      <text x="24" y="48" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#047857">#1004</text>
      <text x="130" y="48" font-family="-apple-system, sans-serif" font-size="14" fill="#334155">Today, 2:02 PM</text>
      <text x="240" y="40" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Ahmed Khan</text>
      <text x="240" y="62" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">+92 320 3737570</text>
      <text x="440" y="48" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">PKR 3,500</text>
      
      <!-- Payment Badge -->
      <rect x="560" y="32" width="100" height="26" rx="6" fill="#fef3c7" />
      <text x="610" y="49" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Pending COD</text>

      <!-- Automated Tag Badge (GREEN HERO) -->
      <g transform="translate(700, 26)">
        <rect width="170" height="38" rx="8" fill="#008060" />
        <text x="85" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
          🏷️ COD-Confirmed
        </text>
      </g>

      <!-- Fulfillment Badge -->
      <rect x="960" y="32" width="160" height="28" rx="14" fill="#dcfce7" />
      <text x="1040" y="50" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">
        🟢 Verified — Safe to Ship
      </text>
    </g>

    <!-- Row 2: COD-Cancelled -->
    <g transform="translate(40, 315)">
      <rect width="1280" height="75" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="24" y="44" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">#1003</text>
      <text x="130" y="44" font-family="-apple-system, sans-serif" font-size="14" fill="#64748b">Today, 1:45 PM</text>
      <text x="240" y="44" font-family="-apple-system, sans-serif" font-size="14" fill="#334155">Sara Malik</text>
      <text x="440" y="44" font-family="-apple-system, sans-serif" font-size="15" fill="#0f172a">PKR 2,100</text>
      
      <!-- Payment Badge: Voided -->
      <rect x="560" y="28" width="80" height="26" rx="6" fill="#f1f5f9" />
      <text x="600" y="45" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Voided</text>

      <!-- Tag Badge: CANCELLED (RED) -->
      <g transform="translate(700, 24)">
        <rect width="170" height="34" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
        <text x="85" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">
          🏷️ COD-Cancelled
        </text>
      </g>

      <rect x="960" y="28" width="160" height="26" rx="13" fill="#fee2e2" />
      <text x="1040" y="45" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">
        🔴 Cancelled &amp; Restocked
      </text>
    </g>

    <!-- Row 3: COD-Expired -->
    <g transform="translate(40, 405)">
      <rect width="1280" height="75" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="24" y="44" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">#1002</text>
      <text x="130" y="44" font-family="-apple-system, sans-serif" font-size="14" fill="#64748b">Yesterday</text>
      <text x="240" y="44" font-family="-apple-system, sans-serif" font-size="14" fill="#334155">Ali Raza</text>
      <text x="440" y="44" font-family="-apple-system, sans-serif" font-size="15" fill="#0f172a">PKR 4,800</text>
      
      <rect x="560" y="28" width="100" height="26" rx="6" fill="#fef3c7" />
      <text x="610" y="45" font-family="-apple-system, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Pending COD</text>

      <!-- Tag Badge: EXPIRED (AMBER) -->
      <g transform="translate(700, 24)">
        <rect width="170" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
        <text x="85" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">
          🏷️ COD-Expired
        </text>
      </g>

      <rect x="960" y="28" width="160" height="26" rx="13" fill="#fef3c7" />
      <text x="1040" y="45" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">
        🟡 24h Expiry — On Hold
      </text>
    </g>

    <!-- Bottom Timeline Callout Card -->
    <g transform="translate(40, 500)">
      <rect width="1280" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6" />
      <text x="30" y="40" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a">
        Order Timeline Event Recorded Automatically
      </text>
      
      <!-- Timeline Node -->
      <circle cx="45" cy="80" r="12" fill="#008060" />
      <path d="M 40,80 L 44,84 L 50,76" stroke="#ffffff" stroke-width="2" fill="none" />
      
      <text x="75" y="78" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
        Order verified via SwiftCOD WhatsApp interactive quick-reply
      </text>
      <text x="75" y="102" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">
        Customer Ahmed Khan confirmed delivery intent in 38 seconds. Order tagged with "COD-Confirmed".
      </text>
      <text x="1160" y="78" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">2:02 PM</text>
    </g>
  </g>
</svg>
