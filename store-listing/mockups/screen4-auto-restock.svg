<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f28" />
      <stop offset="50%" stop-color="#0c0a1a" />
      <stop offset="100%" stop-color="#05040a" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="cardShadow4" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bgGrad4)" />
  <circle cx="800" cy="550" r="450" fill="#6366f1" opacity="0.1" filter="blur(90px)" />
  <circle cx="1300" cy="400" r="300" fill="#10b981" opacity="0.08" filter="blur(80px)" />

  <!-- Top Category Tag -->
  <g transform="translate(800, 75)">
    <rect x="-190" y="0" width="380" height="38" rx="19" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.5" />
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">AUTOMATED INVENTORY PROTECTION</text>
  </g>

  <!-- Main Headline -->
  <text x="800" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Automated Restocking for Unattended or Rejected Orders
  </text>
  
  <!-- Sub-headline -->
  <text x="800" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Instantly return rejected products to available inventory so paying buyers can purchase.
  </text>

  <!-- Flow Visual: 3 Major Action Cards with Connecting Energy Arrows -->
  <g transform="translate(100, 260)">
    
    <!-- Step 1: Customer Cancels on WhatsApp -->
    <g transform="translate(0, 0)" filter="url(#cardShadow4)">
      <rect width="420" height="480" rx="22" fill="#181826" stroke="#ef4444" stroke-width="1.5" />
      <rect width="420" height="70" rx="22" fill="#ef4444" fill-opacity="0.15" />
      <text x="30" y="44" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#f87171">
        STAGE 1: CUSTOMER DECISION
      </text>

      <!-- Graphic: Mobile bubble with Cancel button tapped -->
      <g transform="translate(30, 100)">
        <rect width="360" height="220" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="20" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Order #1003 — PKR 2,100</text>
        <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Customer placed order by mistake</text>
        
        <!-- Cancel Button Highlighted -->
        <rect x="20" y="95" width="320" height="52" rx="12" fill="#dc2626" />
        <circle cx="50" cy="121" r="14" fill="#991b1b" />
        <path d="M 44,115 L 56,127 M 56,115 L 44,127" stroke="#ffffff" stroke-width="2.5" />
        <text x="75" y="127" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">
          Cancel Order
        </text>
        <!-- Finger Tap Icon -->
        <circle cx="310" cy="121" r="18" fill="#ffffff" fill-opacity="0.3" />
        <circle cx="310" cy="121" r="8" fill="#ffffff" />
      </g>

      <text x="30" y="365" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
        Immediate Rejection Capture
      </text>
      <text x="30" y="395" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">
        Customer taps cancel button within minutes. Prevents fake parcel dispatch and courier penalty fees.
      </text>
      
      <rect x="30" y="425" width="220" height="30" rx="15" fill="#fee2e2" />
      <text x="140" y="445" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">
        🛡️ Intercepted Before Shipping
      </text>
    </g>

    <!-- Connector Arrow 1 -->
    <g transform="translate(435, 220)">
      <circle cx="25" cy="25" r="24" fill="#4f46e5" />
      <path d="M 18,25 L 32,25 M 26,18 L 32,25 L 26,32" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Step 2: SwiftCOD Automation Engine -->
    <g transform="translate(490, 0)" filter="url(#cardShadow4)">
      <rect width="420" height="480" rx="22" fill="#181826" stroke="#6366f1" stroke-width="1.5" />
      <rect width="420" height="70" rx="22" fill="#6366f1" fill-opacity="0.15" />
      <text x="30" y="44" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#a5b4fc">
        STAGE 2: SHOPIFY API MUTATION
      </text>

      <!-- Code Box -->
      <g transform="translate(30, 100)">
        <rect width="360" height="220" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="35" font-family="Courier, monospace" font-size="12" fill="#38bdf8">mutation OrderCancel {</text>
        <text x="36" y="60" font-family="Courier, monospace" font-size="12" fill="#f1f5f9">orderCancel(</text>
        <text x="52" y="85" font-family="Courier, monospace" font-size="12" fill="#e2e8f0">orderId: "#1003",</text>
        <text x="52" y="110" font-family="Courier, monospace" font-size="12" fill="#4ade80">restock: true,</text>
        <text x="52" y="135" font-family="Courier, monospace" font-size="12" fill="#f59e0b">reason: CUSTOMER,</text>
        <text x="52" y="160" font-family="Courier, monospace" font-size="12" fill="#cbd5e1">staffNote: "WhatsApp Auto"</text>
        <text x="36" y="185" font-family="Courier, monospace" font-size="12" fill="#f1f5f9">)</text>
        <text x="20" y="205" font-family="Courier, monospace" font-size="12" fill="#38bdf8">}</text>
      </g>

      <text x="30" y="365" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
        GraphQL Order Auto-Cancel
      </text>
      <text x="30" y="395" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">
        Instantly triggers official Shopify cancel mutation with restock enabled and sets payment to Voided.
      </text>

      <rect x="30" y="425" width="220" height="30" rx="15" fill="#e0e7ff" />
      <text x="140" y="445" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">
        ⚡ Sub-Second API Execution
      </text>
    </g>

    <!-- Connector Arrow 2 -->
    <g transform="translate(925, 220)">
      <circle cx="25" cy="25" r="24" fill="#10b981" />
      <path d="M 18,25 L 32,25 M 26,18 L 32,25 L 26,32" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Step 3: Available Inventory Live -->
    <g transform="translate(980, 0)" filter="url(#cardShadow4)">
      <rect width="420" height="480" rx="22" fill="#181826" stroke="#10b981" stroke-width="1.5" />
      <rect width="420" height="70" rx="22" fill="#10b981" fill-opacity="0.15" />
      <text x="30" y="44" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#34d399">
        STAGE 3: INVENTORY RESTORED
      </text>

      <!-- Inventory Success Card -->
      <g transform="translate(30, 100)">
        <rect width="360" height="220" rx="16" fill="#022c22" stroke="#047857" stroke-width="1.5" />
        
        <circle cx="180" cy="55" r="30" fill="#10b981" />
        <path d="M 168,55 L 176,63 L 192,47" stroke="#ffffff" stroke-width="3.5" fill="none" />
        
        <text x="180" y="125" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">
          +1 Restocked
        </text>
        <text x="180" y="155" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#6ee7b7" text-anchor="middle">
          Item Available on Storefront
        </text>
        <text x="180" y="185" font-family="-apple-system, sans-serif" font-size="13" fill="#a7f3d0" text-anchor="middle">
          Zero Stock Locked in Limbo
        </text>
      </g>

      <text x="30" y="365" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
        Zero Dead Inventory Loss
      </text>
      <text x="30" y="395" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">
        Other paying buyers can purchase the product immediately without waiting for courier return cycles.
      </text>

      <rect x="30" y="425" width="220" height="30" rx="15" fill="#d1fae5" />
      <text x="140" y="445" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">
        💰 Courier Loss Avoided
      </text>
    </g>
  </g>

  <!-- Bottom Metric Callout Bar -->
  <g transform="translate(200, 800)">
    <rect width="1200" height="120" rx="18" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="50" y="45" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
      Customizable Timeout Expiry Engine
    </text>
    <text x="50" y="75" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">
      Unattended orders that receive no customer response after 12, 24, or 48 hours are tagged as "COD-Expired" to prevent shipping to ghost buyers.
    </text>
    
    <rect x="960" y="38" width="190" height="44" rx="22" fill="#008060" />
    <text x="1055" y="65" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">
      100% Automated
    </text>
  </g>
</svg>
