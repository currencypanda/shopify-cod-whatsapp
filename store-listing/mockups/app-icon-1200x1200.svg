<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004c3f" />
      <stop offset="60%" stop-color="#008060" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="1200" height="1200" rx="260" fill="url(#iconBg)" />

  <!-- Subtle ambient inner glow ring -->
  <rect x="20" y="20" width="1160" height="1160" rx="250" fill="none" stroke="#25D366" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Composite Icon: Delivery Shield + WhatsApp Chat Bubble + Verification Check -->
  <g transform="translate(600, 570)" filter="url(#iconShadow)">
    
    <!-- Outer Shield / Parcel Symbol -->
    <path d="M 0,-340 
             C 160,-340 290,-300 320,-240 
             C 340,-100 350,140 260,260 
             C 180,360 40,410 0,430 
             C -40,410 -180,360 -260,260 
             C -350,140 -340,-100 -320,-240 
             C -290,-300 -160,-340 0,-340 Z" 
          fill="url(#shieldGrad)" />

    <!-- WhatsApp Chat Bubble Inset -->
    <circle cx="0" cy="-40" r="210" fill="#128C7E" />
    <!-- Speech bubble pointer -->
    <path d="M -90,90 L -160,180 L -30,130 Z" fill="#128C7E" />

    <!-- Radiant Inner Glow Circle -->
    <circle cx="0" cy="-40" r="175" fill="#25D366" />

    <!-- Sharp Checkmark Icon -->
    <path d="M -80,-45 L -20,15 L 85,-90" 
          stroke="#ffffff" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Small Parcel Box Accent at Bottom -->
    <g transform="translate(0, 240)">
      <rect x="-80" y="-30" width="160" height="70" rx="14" fill="#004c3f" />
      <path d="M -80,0 L 80,0 M 0,-30 L 0,40" stroke="#25D366" stroke-width="4" />
      <text x="0" y="5" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">COD</text>
    </g>
  </g>
</svg>
