services:
  - type: web
    name: swiftcod-whatsapp-verify
    runtime: node
    plan: standard
    region: oregon
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.postgresql.prisma && npm run build
    preDeployCommand: npx prisma db push --schema=prisma/schema.postgresql.prisma
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: write_products,read_orders,write_orders,read_customers
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
